name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Uncompress On-Device AI Models
        run: |
          if [ -f assets/models/model_int8.onnx.gz ]; then
            gzip -d -k -f assets/models/model_int8.onnx.gz
            echo "Decompressed model_int8.onnx successfully"
          fi
          ls -lh assets/models/

      - name: 📦 Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: ⚙️ Generate Native Android Project
        run: |
          npx expo prebuild --platform android --clean

      - name: 📱 Compile Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🚀 Upload APK Artifact (Direct Download)
        uses: actions/upload-artifact@v4
        with:
          name: SmartGallery-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
